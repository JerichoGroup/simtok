# =============================================================================
# SimTok Unified Configuration
# =============================================================================

[paths]
data_root = "data"
video_dir = "data/videos"
pose_dir = "data/poses"
bbox_dir = "data/bboxes"
json_dir = "data/jsons"
noise_video_dir = "data/noise_videos"
usd_path = "usd/maps/scenes/cube.usda"

# =============================================================================
# Data Collection (collect)
# =============================================================================

[collect]
num_samples = 1
video_duration_sec = 3
video_fps = 20
initial_scene_load_time_sec = 5
camera_settle_time_sec = 2

[collect.random]
enabled = false                 # generate random POVs instead of [[collect.povs]]
num_povs = 3                    # how many random POVs to generate
backward_m_range = [10.0, 400.0]    # distance behind the target (positive)
right_m_range = [-50.0, 50.0]       # lateral offset (negative = left)
up_m_range = [0.0, 100.0]           # height above the target
zoom_range = [0.0, 1.0]             # zoom value (0.0 wide .. 1.0 tele)

[collect.target]
lat = 32.12345
lon = 35.12345
alt = 0.0
roll = 0.0
pitch = 0.0
yaw = 90.0

[[collect.povs]]
id = 1
backward_m = 10.0
right_m = 0.0
up_m = 0.0
zoom = 0.0

[[collect.povs]]
id = 2
backward_m = 10.0
right_m = 5.0
up_m = 0.0
zoom = 0.0

[[collect.povs]]
id = 3
backward_m = 10.0
right_m = 5.0
up_m = 0.0
zoom = 0.25

[[collect.povs]]
id = 4
backward_m = 400.0
right_m = 5.0
up_m = 6.0
zoom = 1.0

# =============================================================================
# Noise Processor
# =============================================================================

[noise]
max_workers = 0                 # parallel video workers; 0 = auto (min(num_videos, cpu_count))
gaussian_noise_std = 2.0
gaussian_noise_signal_multiplier = 4.0
temporal_noise_std = 1.5
fixed_pattern_std = 2.0
fixed_pattern_column_std = 2.0
fixed_pattern_row_std = 1.0
fixed_pattern_drift_std = 0.002
blur_sigma = 0.8
hot_pixel_rate = 0.00015
hot_pixel_intensity = 35.0
dead_pixel_rate = 0.00010
sensor_drift_std = 0.02

[noise.toggles]
enable_fixed_pattern = true
enable_temporal_noise = true
enable_gaussian_noise = true
enable_blur = true
enable_agc = true
enable_low_resolution = true
enable_sensor_drift = true
enable_hot_pixels = true
enable_dead_pixels = true

[noise.image]
contrast = 1.0
brightness = 0

# =============================================================================
# Grayscale Script Node (Isaac Sim)
# =============================================================================

[grayscale]
bbox_topic_name = "/isaac_core/bbox"
target_name = "Cube"
reset_oscillation_topic = "/simtok/reset_oscillation"
new_oscillation_topic = "/simtok/new_oscillation"
alpha = 0.001

[grayscale.oscillation]
min = -0.26
max = 0.26
num_values_min = 300
num_values_max = 600

[[grayscale.prims]]
path = "/bboxes/Cube"
default_gray = 0.5

[[grayscale.prims]]
path = "/World/line2"
default_gray = 0.7

# =============================================================================
# Zoom Script Node (Isaac Sim) + Zoom Manager (host)
# =============================================================================

[zoom]
zoom_topic = "/simtok/zoom"
camera_prim_path = "/Environment/udp_camera/Xform/main_camera_01"
zoom_curve = "geometric"        # "geometric" | "linear"

[zoom.sensor]
width_mm = 5.57                 # e.g. a 1/2.8" sensor
height_mm = 3.13

[zoom.hfov]
wide_deg = 65.0                 # at zoom = 0.0
tele_deg = 7.2                  # at zoom = 1.0

[zoom.slew]
duration_sec = 4.0
hz = 20.0

[zoom.logging]
log_path = "/tmp/zoom_node.log"
log_every_sec = 5.0             # heartbeat period when nothing is changing
